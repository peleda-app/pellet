name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -q -p pellet-load -- --messages 20 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo test --release -q -p pellet-load
